<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; font-family: sans-serif; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        canvas { border: 4px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 5px auto; border-radius: 8px; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100; display:flex; flex-direction:column; align-items:center; padding: 20px; justify-content: center; }
        .btn { padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; margin: 5px; width: 240px; font-weight: bold; }
        .controls-container { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: space-around; align-items: center; }
        .d-pad { display: grid; grid-template-areas: ". up ." "left down right"; gap: 5px; }
        .ctrl-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid #666; }
        .fire-btn { background: rgba(255, 0, 0, 0.5); width: 80px; height: 80px; }
        #adminPanel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.9); padding: 10px; border: 2px solid #ff0055; border-radius: 12px; display: none; z-index: 200; width: 150px; }
        #admTrigger { position: absolute; top: 0; right: 0; width: 50px; height: 50px; z-index: 201; opacity: 0; }
    </style>
</head>
<body>
    <div id="admTrigger" onclick="toggleAdmin()"></div>
    <div id="adminPanel">
        <button class="btn" style="width:100%; font-size:11px; padding:8px;" onclick="adminMode('savas')">SAVAŞ (3HP)</button>
        <button class="btn" style="width:100%; font-size:11px; padding:8px;" onclick="adminMode('zombi')">ZOMBİ (10HP)</button>
        <button class="btn" style="width:100%; font-size:11px; padding:8px;" onclick="adminMode('bayrak')">BAYRAK (1HP)</button>
        <button class="btn" style="width:100%; font-size:11px; padding:8px; background:#555;" onclick="toggleAdmin()">KAPAT</button>
    </div>

    <div id="gameOverlay" class="overlay">
        <h2>OSMAN OYUN</h2>
        <input type="text" id="nameInput" placeholder="İsim...">
        <select id="modeSelect"><option value="savas">Savaş (3 HP)</option><option value="zombi">Zombi (10 HP)</option><option value="bayrak">Bayrak (1 HP)</option></select>
        <button class="btn" onclick="createRoom()">ODA KUR</button>
        <div id="roomListContainer"></div>
    </div>

    <div id="lobby" class="overlay" style="display:none;">
        <h3>LOBİ</h3>
        <div id="playerList"></div>
        <button class="btn" id="sBtn" style="display:none; background:#ff9800;" onclick="socket.emit('startGameSignal')">BAŞLAT</button>
    </div>

    <div id="status" style="position:absolute; top:10px; left:10px; color:#4CAF50; font-weight:bold;">Can: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls-container">
        <div class="d-pad">
            <div class="ctrl-btn" ontouchstart="socket.emit('move','up')">▲</div>
            <div class="ctrl-btn" ontouchstart="socket.emit('move','left')">◀</div>
            <div class="ctrl-btn" ontouchstart="socket.emit('move','right')">▶</div>
            <div class="ctrl-btn" ontouchstart="socket.emit('move','down')">▼</div>
        </div>
        <div class="action-btns">
            <div class="ctrl-btn" style="background:blue; width:50px; height:50px; margin-bottom:5px;" ontouchstart="socket.emit('specialPower')">B</div>
            <div class="ctrl-btn fire-btn" ontouchstart="socket.emit('fire')">🔥</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        function toggleAdmin() { const p = document.getElementById('adminPanel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
        function adminMode(m) { socket.emit('adminChangeMode', m); toggleAdmin(); }
        function createRoom() { socket.emit('createRoom', { roomName: "OsmanOda", userName: document.getElementById('nameInput').value || "Osman", mode: document.getElementById('modeSelect').value }); }
        
        socket.on('roomList', (rooms) => { 
            const container = document.getElementById('roomListContainer'); container.innerHTML = "";
            rooms.forEach(r => { container.innerHTML += `<div class="room-card">${r.name}<br><button class="btn" style="width:100%;" onclick="socket.emit('joinExistingRoom', {roomName:'${r.name}', userName:document.getElementById('nameInput').value})">GİR</button></div>`; });
        });
        socket.on('joined', d => { document.getElementById('gameOverlay').style.display='none'; document.getElementById('lobby').style.display='flex'; if(d.isLeader) document.getElementById('sBtn').style.display='block'; });
        socket.on('updatePlayerList', (ps) => { document.getElementById('playerList').innerHTML = ps.map(p => "• " + p.name).join("<br>"); });
        socket.on('gameStarted', () => document.getElementById('lobby').style.display='none');

        socket.on('state', d => {
            ctx.clearRect(0,0,400,400);
            (d.walls||[]).forEach(w=>{ ctx.fillStyle="#555"; ctx.fillRect(w.x,w.y,w.w,w.h); });
            (d.bullets||[]).forEach(b => { ctx.fillStyle="orange"; ctx.fillRect(b.x, b.y, 8, 8); });
            (d.zombies||[]).forEach(z => { ctx.fillStyle="green"; ctx.fillRect(z.x, z.y, 25, 25); });
            for(let id in d.players){ 
                let p = d.players[id]; 
                if(p.hp > 0) { 
                    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 25, 25);
                    if(id===socket.id) document.getElementById('status').innerText = "Can: " + Math.ceil(p.hp) + " | " + d.mode.toUpperCase(); 
                } 
            }
        });

        // Zoom Engelleyici Script
        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        let lastTouch = 0;
        document.addEventListener('touchend', (e) => { let now = Date.now(); if (now - lastTouch <= 300) e.preventDefault(); lastTouch = now; }, false);
    </script>
</body>
</html>
