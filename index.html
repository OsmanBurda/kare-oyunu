<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; }
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; font-family: sans-serif; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        canvas { border: 4px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 5px auto; border-radius: 8px; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:100; display:flex; flex-direction:column; align-items:center; padding: 20px; overflow-y: auto; }
        .btn { padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; margin: 5px; width: 220px; font-weight: bold; cursor: pointer; }
        
        .help-panel { background: #333; padding: 10px; border-radius: 8px; font-size: 13px; text-align: left; width: 250px; margin-bottom: 10px; border-left: 4px solid #ff9800; }
        .help-panel b { color: #ff9800; }

        .controls-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px; }
        .row { display: flex; gap: 12px; }
        .ctrl-btn { width: 60px; height: 60px; background: #444; border-radius: 12px; color: white; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .fire-btn { background: #ff4444 !important; width: 80px; }
        .special-btn { background: #ff9800 !important; color: black !important; width: 80px; font-size: 32px; border: 3px solid white; box-shadow: 0 0 15px #ff9800; }
    </style>
</head>
<body>
    <div id="gameOverlay" class="overlay">
        <h2>KARE OYUNLARI</h2>
        
        <div class="help-panel">
            <b>NASIL OYNANIR:</b><br>
            • <b>Hareket:</b> Ok tuşları (▲▼◀▶) veya W-A-S-D.<br>
            • <b>Ateş:</b> 🔥 butonu veya Boşluk (Space).<br>
            • <b>Özel Güç (B):</b> Mavi patlama dalgası yaratır. (Sadece Zombi ve Labirent modunda).<br>
            • <b>Amaç:</b> Savaşta hayatta kal, Zombide dalgaları temizle, Labirentte çıkışa ulaş!
        </div>

        <input type="text" id="nameInput" placeholder="İsim..." style="padding:10px; width:220px; margin:5px; border-radius:8px;">
        <input type="text" id="roomNameInput" placeholder="Oda Adı" style="padding:10px; width:220px; margin:5px; border-radius:8px;">
        <select id="modeSelect" style="padding:10px; width:220px; margin:5px; border-radius:8px;">
            <option value="zombi">Zombi Modu</option>
            <option value="savas">Savaş Modu (3 Can)</option>
            <option value="labirent">Labirent Modu</option>
        </select>
        <button class="btn" onclick="createRoom()">ODA KUR / GİR</button>
    </div>

    <div id="lobby" class="overlay" style="display:none;"><h3>Lobi</h3><div id="playerList"></div><button class="btn" id="sBtn" style="display:none;" onclick="socket.emit('startGameSignal')">BAŞLAT</button></div>
    
    <div id="status" style="color:#FFD700; font-weight:bold; height: 20px; margin-bottom: 5px;">...</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls-container">
        <div class="row"><button class="ctrl-btn" ontouchstart="socket.emit('move','up')">▲</button></div>
        <div class="row"><button class="ctrl-btn" ontouchstart="socket.emit('move','left')">◀</button><button class="ctrl-btn" ontouchstart="socket.emit('move','down')">▼</button><button class="ctrl-btn" ontouchstart="socket.emit('move','right')">▶</button></div>
        <div class="row">
            <button class="ctrl-btn fire-btn" ontouchstart="socket.emit('fire')">🔥</button>
            <button id="specialBtn" class="ctrl-btn special-btn" ontouchstart="socket.emit('specialPower')">B</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let currentEffect = null; let gameMode = '';

        function createRoom() { socket.emit('createRoom', { roomName: document.getElementById('roomNameInput').value, userName: document.getElementById('nameInput').value, mode: document.getElementById('modeSelect').value }); }
        
        socket.on('joined', d => { 
            gameMode = d.mode;
            document.getElementById('gameOverlay').style.display='none'; 
            document.getElementById('lobby').style.display='flex'; 
            if(d.isLeader) document.getElementById('sBtn').style.display='block';
            // SAVAŞ MODUNDA B BUTONUNU GİZLE
            document.getElementById('specialBtn').style.display = (gameMode === 'savas' ? 'none' : 'flex');
        });

        socket.on('updatePlayerList', d => { document.getElementById('playerList').innerHTML = d.players.map(p => `<div>• ${p.name}</div>`).join(""); });
        socket.on('gameStarted', () => document.getElementById('lobby').style.display='none');
        socket.on('winner', m => { alert(m); location.reload(); });
        
        socket.on('specialEffect', d => { 
            currentEffect = {x: d.x, y: d.y, r: 0}; 
            const anim = setInterval(() => {
                if(currentEffect) currentEffect.r += 10;
                if(currentEffect && currentEffect.r > 100) { clearInterval(anim); currentEffect = null; }
            }, 30);
        });

        socket.on('state', d => {
            ctx.clearRect(0,0,400,400); ctx.fillStyle="#333"; (d.walls||[]).forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
            if(currentEffect) {
                ctx.beginPath(); ctx.arc(currentEffect.x, currentEffect.y, currentEffect.r, 0, Math.PI*2);
                ctx.strokeStyle = "rgba(0, 191, 255, 0.8)"; ctx.lineWidth = 5; ctx.stroke();
                ctx.fillStyle = "rgba(0, 191, 255, 0.2)"; ctx.fill();
            }
            (d.bullets||[]).forEach(b=>{
                ctx.fillStyle="#FFD700"; ctx.fillRect(b.x,b.y,12,12); 
                ctx.strokeStyle="black"; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,12,12);
            });
            (d.zombies||[]).forEach(z=>{ctx.fillStyle="green"; ctx.fillRect(z.x,z.y,25,25);});
            for(let id in d.players){ 
                let p = d.players[id]; if(p.hp > 0) { 
                    ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,25,25); 
                    if(id===socket.id) document.getElementById('status').innerText = (d.mode==='zombi' ? `Dalga: ${d.wave} | Can: ${Math.ceil(p.hp)}` : `Can: ${p.hp}`);
                } 
            }
        });

        window.addEventListener('keydown', e => {
            const keys = { w:'up', s:'down', a:'left', d:'right', ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
            if(keys[e.key]) socket.emit('move', keys[e.key]);
            if(e.code === 'Space') socket.emit('fire');
            if(e.key.toLowerCase() === 'b' && gameMode !== 'savas') socket.emit('specialPower');
        });
    </script>
</body>
</html>
