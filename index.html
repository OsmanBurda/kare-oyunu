<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        /* Tüm sayfanın ve butonların yakınlaştırmasını/kaymasını engeller */
        * { 
            touch-action: none; 
            -webkit-text-size-adjust: none; 
            -webkit-touch-callout: none; 
            user-select: none; 
        }
        
        body { 
            background: #1a1a1a; 
            color: white; 
            text-align: center; 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            position: fixed; /* Ekranın kaymasını engeller */
            width: 100%; 
            height: 100%; 
        }

        canvas { 
            border: 4px solid #4CAF50; 
            background: #eee; 
            width: 300px; /* Mobilde daha iyi sığması için hafif küçültüldü */
            height: 300px; 
            display: block; 
            margin: 5px auto; 
            touch-action: none; 
        }

        /* Kontrol butonları için özel ayar: Tıklamada zoom yapmaz */
        .ctrl-btn { 
            padding: 20px; 
            background: #444; 
            border-radius: 8px; 
            font-weight: bold; 
            border: none; 
            color: white; 
            touch-action: manipulation; /* Sadece tıklamaya izin verir, zoom'a değil */
        }
    </style>
</head>
<body>
    <script>
        // Tarayıcının çift tıklama ile zoom yapmasını JS ile de engelliyoruz
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
