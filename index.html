<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Osman Game - Admin Panel</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        canvas { display: block; background: #333; }
        
        /* Admin Paneli Sağ Üst Köşe */
        #adminPanel {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); color: white; padding: 15px;
            border: 2px solid #ff0055; border-radius: 12px; display: none; z-index: 100;
            width: 160px; text-align: center;
        }
        .admin-btn {
            background: #444; color: white; border: 1px solid #fff;
            padding: 10px; margin: 5px 0; cursor: pointer; width: 100%;
            border-radius: 5px; font-weight: bold;
        }
        /* Telefonda basmak için tetikleyici */
        #adminTrigger {
            position: absolute; top: 0; right: 0; width: 50px; height: 50px;
            background: rgba(255, 0, 85, 0.2); z-index: 101; cursor: pointer;
        }
        #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 18px; }
    </style>
</head>
<body>

    <div id="adminTrigger" onclick="toggleAdmin()"></div>

    <div id="ui">
        Mod: <span id="modeDisplay">VS</span> | HP: <span id="hpDisplay">3</span>
    </div>

    <div id="adminPanel">
        <h4 style="margin:0 0 10px 0;">Osman Admin</h4>
        <button class="admin-btn" onclick="setMode('vs')">VS (3 HP)</button>
        <button class="admin-btn" onclick="setMode('flag')">Bayrak (1 HP)</button>
        <button class="admin-btn" onclick="setMode('zombie')">Zombi (10 HP)</button>
        <button class="admin-btn" onclick="setMode('maze')">Labirent (∞)</button>
        <hr>
        <button class="admin-btn" style="background:#888;" onclick="toggleAdmin()">Kapat</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="index.js"></script>
</body>
</html>
