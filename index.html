<div id="lobby" class="overlay" style="display:none;">
    <h2 id="lText">Lobi</h2>
    <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:10px; width:260px; margin-bottom:10px;">
        <h4 style="margin-top:0;">Oyuncular:</h4>
        <div id="playerList" style="text-align:left; font-size:14px;"></div>
    </div>
    <button class="btn" id="sBtn" style="display:none; background:#ff9800;" onclick="socket.emit('startGameSignal')">OYUNU BAŞLAT</button>
</div>

<script>
    // Oyuncu listesini güncelleyen fonksiyon
    socket.on('updatePlayerList', (players) => {
        const listDiv = document.getElementById('playerList');
        listDiv.innerHTML = "";
        players.forEach(p => {
            let teamInfo = p.team ? ` [${p.team}]` : "";
            listDiv.innerHTML += `<div>• ${p.name}${teamInfo}</div>`;
        });
    });

    // ... (createRoom, joined ve gameStarted fonksiyonları aynı)
</script>
