<script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let blastEffect = null;

        // ZOOM KİLİDİ (Kalıcı)
        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

        socket.on('state', d => {
            ctx.clearRect(0,0,400,400);
            
            // BAYRAKLARI ÇİZ
            if(d.mode === 'bayrak') {
                // Kırmızı Bayrak
                ctx.fillStyle = "red";
                ctx.fillRect(d.flags.red.x, d.flags.red.y, 20, 20);
                // Mavi Bayrak
                ctx.fillStyle = "blue";
                ctx.fillRect(d.flags.blue.x, d.flags.blue.y, 20, 20);
            }

            // Oyuncuları Çiz
            Object.values(d.players).forEach(p => {
                if(p.hp > 0) {
                    ctx.fillStyle = p.team === 'red' ? '#ff4444' : '#4444ff';
                    ctx.fillRect(p.x, p.y, 25, 25);
                    
                    // Bayrak taşıyanı işaretle
                    if(p.hasFlag) {
                        ctx.strokeStyle = "yellow";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(p.x-2, p.y-2, 29, 29);
                    }
                }
            });

            // B Gücü, Mermi ve Zombi çizimleri... (Aynı kalıyor)
            if(blastEffect) { /* ... */ }
            d.bullets.forEach(b => { ctx.fillStyle='orange'; ctx.fillRect(b.x, b.y, 8, 8); });
            
            document.getElementById('statsRow').innerText = (d.mode === 'bayrak' ? `SKOR: RED ${d.scores.red} - BLUE ${d.scores.blue}` : `DALGA: ${d.wave}`);
            if(d.winner) alert("KAZANAN: " + d.winner.toUpperCase());
        });
    </script>
