<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: manipulation; user-select: none; box-sizing: border-box; }
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; overflow-y: auto; font-family: sans-serif; }
        canvas { border: 4px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 10px auto; touch-action: none; }
        .btn { padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; margin: 5px; width: 220px; font-weight: bold; }
        .fire-btn { width: 120px; height: 50px; background: #f44336; color: white; border-radius: 10px; border: none; }
        .blast-btn { width: 120px; height: 50px; background: #9c27b0; color: white; border-radius: 10px; margin-left: 5px; border: none; }
    </style>
</head>
<body>
    <div id="gameOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <button class="btn" onclick="startGame('zombi')">ZOMBİ MODUNU BAŞLAT</button>
    </div>
    <div id="status">Can: 10</div>
    <div id="waveInfo">DALGA: 1</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div style="margin-top: 10px;">
        <button class="fire-btn" onclick="socket.emit('fire')">ATEŞ</button>
        <button id="blastBtn" class="blast-btn" onclick="useBlast()">ÖZEL GÜÇ (B)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let lastBlast = 0;
        let blastEffectPos = null;
        let blastTimer = 0;

        function startGame(mode) {
            socket.emit('setMode', mode);
            document.getElementById('gameOverlay').style.display = 'none';
        }

        function useBlast() {
            const now = Date.now();
            if (now - lastBlast > 15000) {
                socket.emit('areaBlast');
                lastBlast = now;
                startCooldown();
            }
        }

        function startCooldown() {
            let btn = document.getElementById('blastBtn');
            let sn = 15; btn.disabled = true;
            let timer = setInterval(() => {
                sn--; btn.innerText = "BEKLE: " + sn;
                if(sn <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = "ÖZEL GÜÇ (B)"; }
            }, 1000);
        }

        // Zoom ve kaydırma koruması her zaman devrede
        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
            
            if (key === 'w' || e.code === 'ArrowUp') socket.emit('move', 'up');
            if (key === 's' || e.code === 'ArrowDown') socket.emit('move', 'down');
            if (key === 'a' || e.code === 'ArrowLeft') socket.emit('move', 'left');
            if (key === 'd' || e.code === 'ArrowRight') socket.emit('move', 'right');
            if (e.code === 'Space') socket.emit('fire');
            
            // Sadece 'b' tuşu özel gücü çalıştırır, 'q' iptal edildi
            if (key === 'b') useBlast();
        }, { passive: false });

        socket.on('blastEffect', (pos) => { blastEffectPos = pos; blastTimer = 10; });

        socket.on('state', (d) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('waveInfo').innerText = "DALGA: " + d.wave;
            
            if(blastEffectPos && blastTimer > 0) {
                ctx.beginPath(); ctx.arc(blastEffectPos.x, blastEffectPos.y, 150, 0, Math.PI*2);
                ctx.strokeStyle = "rgba(156, 39, 176, 0.7)"; ctx.lineWidth = 8; ctx.stroke(); blastTimer--;
            }

            (d.zombies || []).forEach(z => { ctx.fillStyle = "green"; ctx.fillRect(z.x, z.y, 25, 25); });
            (d.bullets || []).forEach(b => { ctx.fillStyle = "yellow"; ctx.fillRect(b.x, b.y, 8, 8); });
            
            for (let id in d.players) {
                let p = d.players[id]; if(!p.active || p.hp <= 0) continue;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 25, 25);
                if(id === socket.id) document.getElementById('status').innerText = "Can: " + p.hp;
            }
        });
    </script>
</body>
</html>
