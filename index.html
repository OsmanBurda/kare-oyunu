<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Osman Game - Admin Panel Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: #333; }
        
        /* Admin Paneli - Sağ Üst Köşe */
        #adminPanel {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); color: white; padding: 15px;
            border: 2px solid #ff0055; border-radius: 12px; display: none; z-index: 100;
            width: 160px; text-align: center;
        }
        .admin-btn {
            background: #444; color: white; border: 1px solid #fff;
            padding: 10px; margin: 5px 0; cursor: pointer; width: 100%;
            border-radius: 5px; font-weight: bold;
        }
        .admin-btn:hover { background: #ff0055; }
        
        /* Telefon için Admin Açma Butonu (Sağ Üst Köşede küçük bir alan) */
        #adminTrigger {
            position: absolute; top: 0; right: 0; width: 50px; height: 50px;
            background: rgba(255, 0, 85, 0.3); z-index: 101; border-radius: 0 0 0 20px;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 10px;
        }
        
        #howToPlay {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.1); color: white;
            padding: 10px; border-radius: 5px; font-size: 12px; pointer-events: none;
        }
        #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 18px; }
    </style>
</head>
<body>

    <div id="adminTrigger" onclick="toggleAdmin()">ADM</div>

    <div id="howToPlay">
        <b>Osman'ın Dünyası</b><br>
        Hareket: WASD | Özel Güç: B<br>
        Panel: P Tuşu veya Sağ Üst Köşe
    </div>

    <div id="ui">
        Mod: <span id="modeDisplay">VS</span> | HP: <span id="hpDisplay">3</span>
    </div>

    <div id="adminPanel">
        <h4 style="margin:0 0 10px 0;">Yönetici</h4>
        <button class="admin-btn" onclick="setMode('vs')">VS (3 HP)</button>
        <button class="admin-btn" onclick="setMode('flag')">Bayrak (1 HP)</button>
        <button class="admin-btn" onclick="setMode('zombie')">Zombi (10 HP)</button>
        <button class="admin-btn" onclick="setMode('maze')">Labirent (∞)</button>
        <button class="admin-btn" style="background:#888;" onclick="toggleAdmin()">Kapat</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const player = {
        x: 100, y: 100, size: 30, speed: 5,
        hp: 3, maxHp: 3, lastShot: 0, cooldown: 1000,
        mode: 'vs'
    };

    function setMode(mode) {
        player.mode = mode;
        document.getElementById('modeDisplay').innerText = mode.toUpperCase();
        
        if (mode === 'flag') { player.hp = 1; player.maxHp = 1; }
        else if (mode === 'vs') { player.hp = 3; player.maxHp = 3; player.cooldown = 1000; }
        else if (mode === 'zombie') { player.hp = 10; player.maxHp = 10; }
        else if (mode === 'maze') { player.hp = Infinity; }
        
        updateUI();
        toggleAdmin();
    }

    window.onkeydown = (e) => {
        if (e.code === 'KeyP') toggleAdmin();
        if (e.code === 'KeyB') console.log("Özel Güç!");
        if (e.code === 'Space') shoot();
    };

    function toggleAdmin() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function shoot() {
        if (Date.now() - player.lastShot < player.cooldown) return;
        player.lastShot = Date.now();
        console.log("Ateşlendi!");
    }

    function updateUI() {
        document.getElementById('hpDisplay').innerText = player.hp === Infinity ? "Ölümsüz" : player.hp;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = player.mode === 'flag' ? '#00aaff' : '#ff4444';
        ctx.fillRect(player.x, player.y, player.size, player.size);
        
        if (player.mode !== 'maze') {
            ctx.fillStyle = '#555'; ctx.fillRect(player.x, player.y - 10, player.size, 5);
            ctx.fillStyle = '#00ff00'; ctx.fillRect(player.x, player.y - 10, (player.hp / player.maxHp) * player.size, 5);
        }
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
