<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: none !important; user-select: none !important; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: #111; color: white; text-align: center; margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        canvas { border: 4px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 5px auto; border-radius: 8px; }
        #infoPanel { width: 320px; min-height: 60px; background: #222; margin: 5px auto; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; border: 1px solid #444; }
        .stats { display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; }
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-around; align-items: center; }
        .ctrl-btn { width: 65px; height: 65px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #555; }
        .fire { background: #900 !important; width: 80px; height: 80px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="gameOverlay" class="overlay">
        <h2>OSMAN OYUN</h2>
        <input type="text" id="nameInput" placeholder="İsmin" style="padding:10px; margin-bottom:10px;">
        <select id="modeSelect" style="padding:10px; margin-bottom:10px;">
            <option value="savas">SAVAŞ</option>
            <option value="zombi">ZOMBİ</option>
            <option value="bayrak">BAYRAK</option>
        </select>
        <button onclick="socket.emit('createRoom', {mode: document.getElementById('modeSelect').value, userName: document.getElementById('nameInput').value})" style="padding:15px; width:200px; background:#4CAF50; color:white; border:none; border-radius:10px;">OYNA</button>
    </div>

    <div id="hpDisplay" style="color:#4CAF50; font-weight:bold; margin-top:5px;">CAN: -</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="infoPanel">
        <div class="stats" id="statsRow">
            <span>SKOR: 0-0</span>
            <span>DALGA: 1</span>
        </div>
        <div id="winner" style="color:gold; font-weight:bold; margin-top:5px;"></div>
    </div>

    <div class="controls">
        <div style="display:grid; grid-template-areas:'. u .' 'l d r'; gap:8px;">
            <div class="ctrl-btn" style="grid-area:u" ontouchstart="socket.emit('move','up')">▲</div>
            <div class="ctrl-btn" style="grid-area:l" ontouchstart="socket.emit('move','left')">◀</div>
            <div class="ctrl-btn" style="grid-area:d" ontouchstart="socket.emit('move','down')">▼</div>
            <div class="ctrl-btn" style="grid-area:r" ontouchstart="socket.emit('move','right')">▶</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="ctrl-btn" style="background:blue;" ontouchstart="socket.emit('specialPower')">B</div>
            <div class="ctrl-btn fire" ontouchstart="socket.emit('fire')">🔥</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        socket.on('joined', () => document.getElementById('gameOverlay').style.display='none');

        socket.on('state', d => {
            ctx.clearRect(0,0,400,400);
            
            // Panel Güncelleme
            let html = `<span>MOD: ${d.mode.toUpperCase()}</span>`;
            if(d.mode === 'zombi') html += `<span>DALGA: ${d.wave}</span>`;
            if(d.mode === 'bayrak') html += `<span>SKOR: ${d.scores.red}-${d.scores.blue}</span>`;
            document.getElementById('statsRow').innerHTML = html;
            document.getElementById('winner').innerText = d.winner ? "KAZANAN: " + d.winner : "";

            if(d.mode === 'bayrak'){
                ctx.fillStyle='red'; ctx.fillRect(d.flags.red.x, d.flags.red.y, 25, 25);
                ctx.fillStyle='blue'; ctx.fillRect(d.flags.blue.x, d.flags.blue.y, 25, 25);
            }

            Object.values(d.players).forEach(p => {
                if(p.hp > 0) {
                    ctx.fillStyle = p.team === 'red' ? '#ff4444' : '#4444ff';
                    ctx.fillRect(p.x, p.y, 25, 25);
                    if(p.hasFlag) { ctx.fillStyle='yellow'; ctx.fillRect(p.x+5, p.y+5, 15, 15); }
                    if(p.name === document.getElementById('nameInput').value) document.getElementById('hpDisplay').innerText = "CAN: " + Math.ceil(p.hp);
                }
            });

            d.bullets.forEach(b => { ctx.fillStyle='orange'; ctx.fillRect(b.x, b.y, 8, 8); });
            d.zombies.forEach(z => { ctx.fillStyle='#2ecc71'; ctx.fillRect(z.x, z.y, 25, 25); });
        });

        document.addEventListener('touchstart', e => { if(e.touches.length>1) e.preventDefault(); }, {passive:false});
    </script>
</body>
</html>
