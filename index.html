<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Osman Game - Mobil Admin</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: #333; }
        
        /* Admin Paneli */
        #adminPanel {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); color: white; padding: 15px;
            border: 2px solid #ff0055; border-radius: 12px; display: none; z-index: 100;
            width: 140px; text-align: center;
        }
        .admin-btn { background: #444; color: white; border: 1px solid #fff; padding: 10px; margin: 5px 0; width: 100%; border-radius: 5px; }
        #adminTrigger { position: absolute; top: 0; right: 0; width: 60px; height: 60px; z-index: 101; cursor: pointer; background: rgba(255,0,0,0.1); }

        /* MOBİL KONTROLLER */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .d-pad, .action-btns { pointer-events: auto; display: grid; gap: 5px; }
        
        /* Hareket Tuşları (Sol Alt) */
        .d-pad { grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; -webkit-user-select: none; }
        .btn:active { background: rgba(255,255,255,0.5); }
        
        /* Aksiyon Tuşları (Sağ Alt) */
        .action-btns { grid-template-columns: 1fr 1fr; align-items: end; }
        .btn-fire { background: rgba(255, 0, 85, 0.5); width: 80px; height: 80px; border-radius: 50%; }
        .btn-special { background: rgba(0, 170, 255, 0.5); width: 60px; height: 60px; border-radius: 50%; }

        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 16px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="adminTrigger" onclick="toggleAdmin()"></div>
    <div id="ui">Mod: <span id="modeDisplay">VS</span> | HP: <span id="hpDisplay">3</span></div>

    <div id="adminPanel">
        <button class="admin-btn" onclick="setMode('vs')">VS</button>
        <button class="admin-btn" onclick="setMode('flag')">Bayrak</button>
        <button class="admin-btn" onclick="setMode('zombie')">Zombi</button>
        <button class="admin-btn" onclick="setMode('maze')">Labirent</button>
        <button class="admin-btn" style="background:#888;" onclick="toggleAdmin()">Kapat</button>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div class="btn" style="grid-area: up;" ontouchstart="move('up',true)" ontouchend="move('up',false)">↑</div>
            <div class="btn" style="grid-area: left;" ontouchstart="move('left',true)" ontouchend="move('left',false)">←</div>
            <div class="btn" style="grid-area: down;" ontouchstart="move('down',true)" ontouchend="move('down',false)">↓</div>
            <div class="btn" style="grid-area: right;" ontouchstart="move('right',true)" ontouchend="move('right',false)">→</div>
        </div>
        <div class="action-btns">
            <div class="btn btn-special" ontouchstart="useSpecialPower()">B</div>
            <div class="btn btn-fire" ontouchstart="shoot()">🔥</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="index.js"></script>
</body>
</html>
