<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; font-family: sans-serif; }
        canvas { border: 4px solid #4CAF50; background: #eee; display: block; margin: 5px auto; width: 320px; height: 320px; }
        .controls { display: grid; grid-template-areas: ". up ." "left down right" "fire spec fire"; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { width: 65px; height: 65px; background: #444; color: white; border: none; font-size: 24px; border-radius: 12px; }
        .fire-btn { background: #f44336 !important; grid-area: fire; width: 100px; }
        .special-btn { background: #ff9800 !important; grid-area: spec; font-weight: bold; }
        #menu { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>
    <div id="menu">
        <input type="text" id="name" placeholder="İsim">
        <select id="mode">
            <option value="zombi">Zombi Modu</option>
            <option value="vs">Savaş (VS)</option>
            <option value="bayrak">Bayrak Kapmaca</option>
        </select>
        <button onclick="start()">BAŞLA</button>
    </div>

    <div id="status">Can: 10</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="btn" style="grid-area: up" onpointerdown="socket.emit('move','up')">▲</button>
        <button class="btn" style="grid-area: left" onpointerdown="socket.emit('move','left')">◀</button>
        <button class="btn" style="grid-area: down" onpointerdown="socket.emit('move','down')">▼</button>
        <button class="btn" style="grid-area: right" onpointerdown="socket.emit('move','right')">▶</button>
        <button class="btn fire-btn" onpointerdown="socket.emit('fire')">🔥 Ateş</button>
        <button class="btn special-btn" onpointerdown="socket.emit('specialPower')">B</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const ctx = document.getElementById('gameCanvas').getContext('2d');
        let effect = null;
        function start() { 
            socket.emit('createRoom', {userName: document.getElementById('name').value, mode: document.getElementById('mode').value}); 
            document.getElementById('menu').style.display='none'; 
        }

        socket.on('specialEffect', d => { 
            effect = {x: d.x, y: d.y, r: 0};
            let anim = setInterval(() => {
                effect.r += 10;
                if(effect.r > 80) { clearInterval(anim); effect = null; }
            }, 20);
        });

        socket.on('state', d => {
            ctx.clearRect(0, 0, 400, 400);
            if(effect) { // Eski güzel mavi halka efekti
                ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.r, 0, Math.PI*2);
                ctx.strokeStyle="cyan"; ctx.lineWidth=5; ctx.stroke();
            }
            (d.bullets || []).forEach(b => { ctx.fillStyle="orange"; ctx.fillRect(b.x, b.y, 8, 8); });
            (d.zombies || []).forEach(z => { ctx.fillStyle="green"; ctx.fillRect(z.x, z.y, 25, 25); });
            for(let id in d.players) {
                let p = d.players[id]; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 25, 25);
                if(id === socket.id) document.getElementById('status').innerText = "Can: " + Math.ceil(p.hp);
            }
        });
    </script>
</body>
</html>
