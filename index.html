<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { 
            touch-action: none !important; 
            -webkit-user-select: none !important; 
            user-select: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body { 
            position: fixed; 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: #000; margin: 0; padding: 0; 
        }

        #ui-header { display: flex; justify-content: space-between; padding: 10px 20px; color: #4CAF50; font-weight: bold; }
        canvas { border: 3px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 0 auto; border-radius: 12px; }
        #wave-bar { background: #222; color: white; width: 300px; margin: 8px auto; padding: 10px; text-align: center; border-radius: 10px; font-weight: bold; }

        .controls { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .dpad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 12px; }
        .btn { width: 62px; height: 62px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #444; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .action-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn-b { background: #1a237e !important; }
        .btn-fire { background: #b71c1c !important; width: 80px; height: 80px; font-size: 32px; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="gameOverlay" class="overlay">
        <h1>OSMAN OYUN</h1>
        <button style="padding:15px 40px; background:#4CAF50; border:none; color:white; border-radius:10px; font-weight:bold;" onclick="startGame()">BAŞLA</button>
    </div>

    <div id="ui-header"><span id="hp">CAN: -</span><span id="modeText">MOD: ZOMBI</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="wave-bar">DALGA: 1</div>

    <div class="controls">
        <div class="dpad">
            <div class="btn" ontouchstart="socket.emit('move','up')" style="grid-area: u">▲</div>
            <div class="btn" ontouchstart="socket.emit('move','left')" style="grid-area: l">◀</div>
            <div class="btn" ontouchstart="socket.emit('move','right')" style="grid-area: r">▶</div>
            <div class="btn" ontouchstart="socket.emit('move','down')" style="grid-area: d">▼</div>
        </div>
        <div class="action-group">
            <div class="btn btn-b" ontouchstart="socket.emit('specialPower')">B</div>
            <div class="btn btn-fire" ontouchstart="socket.emit('fire')">🔥</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // DOUBLE-TAP ZOOM ENGELLEYİCİ
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        function startGame() {
            socket.emit('createRoom', { mode: 'zombi' });
            document.getElementById('gameOverlay').style.display = 'none';
        }

        socket.on('state', r => {
            ctx.clearRect(0,0,400,400);
            Object.values(r.players).forEach(p => {
                if(p.hp > 0) {
                    ctx.fillStyle = p.team === 'red' ? 'red' : 'blue';
                    ctx.fillRect(p.x, p.y, 25, 25);
                    document.getElementById('hp').innerText = `CAN: ${Math.ceil(p.hp)}`;
                }
            });
            r.zombies.forEach(z => { ctx.fillStyle = '#2ecc71'; ctx.fillRect(z.x, z.y, 22, 22); });
        });
    </script>
</body>
</html>
