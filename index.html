<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        /* ZOOM VE KAYDIRMA KESİN ENGEL */
        * { 
            touch-action: none !important; 
            -webkit-user-select: none !important; 
            user-select: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body { 
            position: fixed; 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: #000; margin: 0; padding: 0; 
        }

        #status-bar { text-align: center; color: #4CAF50; font-weight: bold; padding: 10px; font-size: 14px; }
        canvas { border: 3px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 0 auto; border-radius: 10px; }

        .controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .dpad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 8px; }
        .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 1px solid #555; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .btn-fire { background: #ff4444 !important; width: 70px; height: 70px; font-size: 28px; }
        .btn-b { background: #4444ff !important; font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #startBtn { padding: 15px 40px; background: #4CAF50; border: none; border-radius: 10px; color: white; font-size: 20px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="gameOverlay" class="overlay">
        <h2>OSMAN OYUN</h2>
        <div id="loader">Sunucu Hazırlanıyor...</div>
        <button id="startBtn" style="display:none;" onclick="startGame()">OYUNA BAŞLA</button>
    </div>

    <div id="status-bar">CAN: - | MOD: ZOMBI</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div class="dpad">
            <div class="btn" style="grid-area: u" ontouchstart="socket.emit('move','up')">▲</div>
            <div class="btn" style="grid-area: l" ontouchstart="socket.emit('move','left')">◀</div>
            <div class="btn" style="grid-area: r" ontouchstart="socket.emit('move','right')">▶</div>
            <div class="btn" style="grid-area: d" ontouchstart="socket.emit('move','down')">▼</div>
        </div>
        <div class="action" style="display:flex; flex-direction:column; gap:10px; align-items:center;">
            <div class="btn btn-b" ontouchstart="socket.emit('specialPower')">B</div>
            <div class="btn btn-fire" ontouchstart="socket.emit('fire')">🔥</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ reconnection: true, reconnectionAttempts: 5 });
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ZOOM ENGELLEYİCİ MÜHÜR
        document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());

        socket.on('connect', () => {
            document.getElementById('loader').innerText = "Bağlantı Kuruldu!";
            document.getElementById('startBtn').style.display = 'block';
        });

        function startGame() {
            socket.emit('createRoom', { mode: 'zombi' });
            document.getElementById('gameOverlay').style.display = 'none';
        }

        socket.on('state', r => {
            ctx.clearRect(0,0,400,400);
            Object.values(r.players).forEach(p => {
                if(p.hp > 0) {
                    ctx.fillStyle = p.team === 'red' ? 'red' : 'blue';
                    ctx.fillRect(p.x, p.y, 25, 25);
                    document.getElementById('status-bar').innerText = `CAN: ${Math.ceil(p.hp)} | MOD: ${r.mode.toUpperCase()}`;
                }
            });
            r.zombies.forEach(z => { ctx.fillStyle = '#2ecc71'; ctx.fillRect(z.x, z.y, 25, 25); });
            r.bullets?.forEach(b => { ctx.fillStyle = 'orange'; ctx.fillRect(b.x, b.y, 8, 8); });
        });
    </script>
</body>
</html>
