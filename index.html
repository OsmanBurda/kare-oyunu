<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: none; box-sizing: border-box; -webkit-user-select: none; }
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; }
        #game-container { display: none; margin: 10px auto; position: relative; width: 320px; }
        canvas { background: #222; border: 3px solid #4CAF50; width: 320px; height: 320px; border-radius: 8px; }
        
        /* OYUNCU LİSTESİ - SOL ÜSTE SABİTLENDİ */
        #player-list { position: absolute; top: 5px; left: 5px; width: 80px; background: rgba(0,0,0,0.7); font-size: 10px; padding: 5px; border-radius: 4px; text-align: left; z-index: 10; pointer-events: none; }
        
        /* BAŞLAT BUTONU - EKRANIN ORTASINA */
        #start-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; z-index: 2000; border: 2px solid #4CAF50; width: 280px; }
        
        #lobby { padding: 20px; }
        input, select { width: 80%; padding: 12px; margin: 5px; border-radius: 5px; border: none; }
        .btn { padding: 15px; border-radius: 10px; border: none; font-weight: bold; color: white; background: #444; width: 65px; height: 65px; }
    </style>
</head>
<body>
    <div id="lobby">
        <h2 style="color:#4CAF50">Osman PRO Game</h2>
        <input type="text" id="uname" placeholder="Adın">
        <input type="text" id="rname" placeholder="Oda Adı">
        <select id="mode">
            <option value="zombi">Zombi</option>
            <option value="bayrak">Bayrak</option>
            <option value="vs">Savaş</option>
        </select>
        <button onclick="join()" style="background:#4CAF50; color:white; padding:15px; width:80%; border:none; border-radius:10px; font-weight:bold;">GİRİŞ YAP</button>
    </div>

    <div id="start-panel">
        <p id="wait-msg">OYUNCULAR BEKLENİYOR...</p>
        <button id="start-btn" onclick="socket.emit('startGame')" style="display:none; background:#4CAF50; color:white; padding:15px; width:100%; border:none; border-radius:10px; font-weight:bold;">OYUNU BAŞLAT</button>
    </div>

    <div id="game-ui" style="display:none;">
        <div id="status" style="color:gold; font-weight:bold; margin-bottom:5px;">Can: --</div>
        <div id="game-container">
            <div id="player-list"><b>Kişiler:</b><hr><div id="plist-content"></div></div>
            <canvas id="game" width="400" height="400"></canvas>
        </div>
        </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ctx = document.getElementById('game').getContext('2d');

        function join() {
            const u = document.getElementById('uname').value;
            const r = document.getElementById('rname').value;
            const m = document.getElementById('mode').value;
            if(!u || !r) return alert("Eksik alan!");
            
            socket.emit('createRoom', {userName: u, roomName: r, mode: m});
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('start-panel').style.display = 'block';
        }

        socket.on('joined', data => {
            if(data.isHost) {
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('wait-msg').innerText = "KURUCU SENSİN";
            }
        });

        socket.on('gameStarted', () => {
            document.getElementById('start-panel').style.display = 'none';
        });

        socket.on('state', r => {
            ctx.clearRect(0,0,400,400);
            let plist = "";
            for(let id in r.players) {
                let p = r.players[id];
                plist += `<div>${p.name} [${Math.max(0, p.hp)}]</div>`;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 25, 25);
                if(id === socket.id) document.getElementById('status').innerText = `MOD: ${r.mode.toUpperCase()} | CAN: ${Math.max(0, p.hp)}`;
            }
            document.getElementById('plist-content').innerHTML = plist;
        });
    </script>
</body>
</html>
