<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { touch-action: none; box-sizing: border-box; }
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; overflow: hidden; }
        canvas { background: #222; border: 4px solid #4CAF50; border-radius: 10px; width: 320px; height: 320px; }
        #admin-trigger { position: fixed; top: 0; right: 0; width: 60px; height: 60px; z-index: 9999; }
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #333; padding: 20px; border: 2px solid gold; z-index: 10000; }
        .controls { display: none; margin-top: 10px; flex-direction: column; align-items: center; }
        .btn { width: 70px; height: 70px; background: #444; color: white; border: none; border-radius: 10px; font-size: 24px; margin: 5px; }
        .fire-btn { background: #f44336; width: 150px; }
    </style>
</head>
<body>
    <div id="admin-trigger" onclick="checkAdmin()"></div>
    <div id="admin-panel" id="adminBox">
        <h3>ADMİN PANEL</h3>
        <button onclick="socket.emit('adminAction', {pw:apw, type:'nuke'})">Zombileri Temizle</button>
        <button onclick="document.getElementById('adminBox').style.display='none'">Kapat</button>
    </div>

    <div id="lobby">
        <h2>OSMAN GAME PRO</h2>
        <input type="text" id="nick" placeholder="İsim">
        <input type="text" id="room" placeholder="Oda">
        <select id="mode">
            <option value="zombi">Zombi (10 Can)</option>
            <option value="bayrak">Bayrak (1 Can)</option>
            <option value="vs">Savaş (3 Can)</option>
        </select>
        <button onclick="joinGame()" style="padding:15px; background:#4CAF50; color:white; border-radius:10px;">BAŞLA</button>
    </div>

    <div id="game-ui" style="display:none;">
        <div id="status">Can: --</div>
        <canvas id="game" width="400" height="400"></canvas>
        <div class="controls" id="touch-controls" style="display:flex;">
            <button class="btn" onpointerdown="move('up')">▲</button>
            <div style="display:flex;">
                <button class="btn" onpointerdown="move('left')">◀</button>
                <button class="btn" onpointerdown="move('down')">▼</button>
                <button class="btn" onpointerdown="move('right')">▶</button>
            </div>
            <button class="btn fire-btn" onpointerdown="fire()">ATEŞ 🔥</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const ctx = document.getElementById('game').getContext('2d');
        const WALLS = [{x: 80, y: 120, w: 15, h: 160}, {x: 305, y: 120, w: 15, h: 160}];
        let apw = "";

        // Sayfa yenilense bile verileri hatırla
        window.onload = () => {
            if(localStorage.getItem('osman_nick')) {
                document.getElementById('nick').value = localStorage.getItem('osman_nick');
                document.getElementById('room').value = localStorage.getItem('osman_room');
            }
        };

        function joinGame() {
            const n = document.getElementById('nick').value;
            const r = document.getElementById('room').value;
            const m = document.getElementById('mode').value;
            localStorage.setItem('osman_nick', n);
            localStorage.setItem('osman_room', r);
            socket.emit('createRoom', {userName: n, roomName: r, mode: m});
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
        }

        function checkAdmin() {
            apw = prompt("Şifre:");
            if(apw === "123Osman123Burda") document.getElementById('adminBox').style.display = 'block';
        }

        const move = d => socket.emit('move', d);
        const fire = () => socket.emit('fire');

        socket.on('state', r => {
            ctx.clearRect(0,0,400,400);
            // Duvarları Çiz (Bayrak Modunda)
            if(r.mode === 'bayrak') {
                ctx.fillStyle = "#555";
                WALLS.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
                ctx.fillStyle = "red"; ctx.fillRect(30, 190, 20, 20); // Kırmızı Bayrak
                ctx.fillStyle = "blue"; ctx.fillRect(350, 190, 20, 20); // Mavi Bayrak
            }

            for(let id in r.players) {
                let p = r.players[id];
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 25, 25);
                ctx.fillStyle = "white"; ctx.fillText(p.name, p.x, p.y - 5);
                if(id === socket.id) document.getElementById('status').innerText = `MOD: ${r.mode} | CAN: ${p.hp}`;
            }
        });
    </script>
</body>
</html>
