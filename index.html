<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        /* CSS İLE ZOOM VE KAYDIRMA KİLİDİ */
        * { touch-action: none !important; user-select: none !important; -webkit-tap-highlight-color: transparent; }
        body { background: #111; color: white; text-align: center; margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; font-family: sans-serif; }
        
        #topPanel { width: 320px; margin: 10px auto 0; display: flex; justify-content: space-between; font-weight: bold; color: #4CAF50; font-size: 18px; }
        canvas { border: 4px solid #4CAF50; background: #eee; width: 320px; height: 320px; display: block; margin: 5px auto; border-radius: 8px; }
        
        #infoPanel { width: 320px; height: 45px; background: #222; margin: 5px auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }

        /* TUŞ TAKIMI SABİTLEME */
        .controls-wrapper { position: absolute; bottom: 30px; width: 100%; height: 180px; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; }
        .controls-wrapper > * { pointer-events: auto; }

        .d-pad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 10px; }
        .btn-up { grid-area: u; } .btn-down { grid-area: d; } .btn-left { grid-area: l; } .btn-right { grid-area: r; }

        .action-pad { display: flex; flex-direction: column; gap: 15px; align-items: center; justify-content: flex-end; }
        
        .ctrl-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #555; color: white; }
        .btn-b { background: blue !important; width: 65px; height: 65px; font-weight: bold; border-color: #00008b; }
        .btn-fire { background: #b22222 !important; width: 85px; height: 85px; font-size: 35px; border-color: #800000; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="gameOverlay" class="overlay">
        <h2>OSMAN OYUN</h2>
        <input type="text" id="nameInput" placeholder="İsmin" style="padding:10px; margin-bottom:10px;">
        <select id="modeSelect" style="padding:10px; margin-bottom:10px;">
            <option value="savas">SAVAŞ</option>
            <option value="zombi">ZOMBİ</option>
            <option value="bayrak">BAYRAK</option>
        </select>
        <button onclick="socket.emit('createRoom', {mode: document.getElementById('modeSelect').value, userName: document.getElementById('nameInput').value})" style="padding:15px; width:200px; background:#4CAF50; color:white; border:none; border-radius:10px; font-weight:bold;">BAŞLA</button>
    </div>

    <div id="topPanel">
        <span id="hpDisplay">Can: -</span>
        <span id="modeDisplay">MOD: -</span>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="infoPanel">
        <div id="statsRow" style="font-weight:bold; color:white;">BÖLÜM BİLGİSİ</div>
    </div>

    <div class="controls-wrapper">
        <div class="d-pad">
            <div class="ctrl-btn btn-up" ontouchstart="socket.emit('move','up')">▲</div>
            <div class="ctrl-btn btn-left" ontouchstart="socket.emit('move','left')">◀</div>
            <div class="ctrl-btn btn-right" ontouchstart="socket.emit('move','right')">▶</div>
            <div class="ctrl-btn btn-down" ontouchstart="socket.emit('move','down')">▼</div>
        </div>
        <div class="action-pad">
            <div class="ctrl-btn btn-b" ontouchstart="socket.emit('specialPower')">B</div>
            <div class="ctrl-btn btn-fire" ontouchstart="socket.emit('fire')">🔥</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let blastEffect = null;

        // JAVASCRIPT İLE ZOOM VE ÇİFT TIKLAMA ENGELLEME
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault(); // Çoklu dokunmatik zoom engelle
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault(); // Çift tıkla zoom engelle
            lastTouchEnd = now;
        }, false);

        socket.on('joined', () => document.getElementById('gameOverlay').style.display='none');
        socket.on('blastEffect', data => { blastEffect = { ...data, r: 0 }; });

        socket.on('state', d => {
            ctx.clearRect(0,0,400,400);
            if(blastEffect) {
                ctx.beginPath(); ctx.arc(blastEffect.x, blastEffect.y, blastEffect.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 0, 0, ${0.4 - (blastEffect.r/400)})`; ctx.fill();
                ctx.strokeStyle = `rgba(255, 0, 0, ${1 - blastEffect.r/150})`;
                ctx.lineWidth = 2; ctx.stroke(); blastEffect.r += 12;
                if(blastEffect.r > 150) blastEffect = null;
            }
            document.getElementById('modeDisplay').innerText = d.mode.toUpperCase();
            document.getElementById('statsRow').innerText = (d.mode === 'bayrak' ? `SKOR: ${d.scores.red} - ${d.scores.blue}` : `DALGA: ${d.wave}`);
            Object.values(d.players).forEach(p => {
                if(p.hp > 0) {
                    ctx.fillStyle = p.team === 'red' ? '#ff4444' : '#4444ff';
                    ctx.fillRect(p.x, p.y, 25, 25);
                    if(p.name === document.getElementById('nameInput').value) document.getElementById('hpDisplay').innerText = "Can: " + Math.ceil(p.hp);
                }
            });
            d.bullets.forEach(b => { ctx.fillStyle='orange'; ctx.fillRect(b.x, b.y, 8, 8); });
            d.zombies.forEach(z => { ctx.fillStyle='#2ecc71'; ctx.fillRect(z.x, z.y, 25, 25); });
        });
    </script>
</body>
</html>
